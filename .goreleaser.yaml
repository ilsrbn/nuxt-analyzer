version: 2

project_name: impact-map

before:
  hooks:
    - npm --prefix node install
    - npm --prefix node run build
    - mkdir -p assets
    - cp node/dist/parser.bundle.js assets/parser.bundle.js

builds:
  - id: impact-map
    main: ./cmd/impact-map
    binary: impact-map
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: impact-map
    ids:
      - impact-map
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
