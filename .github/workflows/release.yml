name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build parser bundle
        run: |
          npm --prefix node install
          npm --prefix node run build
          mkdir -p assets
          cp node/dist/parser.bundle.js assets/parser.bundle.js

      - name: Run GoReleaser Cross
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/go/src/github.com/ilsrbn/nuxt-analyzer" \
            -w /go/src/github.com/ilsrbn/nuxt-analyzer \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            ghcr.io/goreleaser/goreleaser-cross:latest \
            release --clean
